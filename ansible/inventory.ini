# Inventario de Ansible: la máquina local y la VM de Google Cloud.

[vm]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# VM spot creada con ../terraform. Descomenta y pon la IP de `terraform output ip_publica`
# (cambia cada vez que se recrea la VM).
[gcp]
# vm-spot-iowa ansible_host=<ip_publica> ansible_user=roberto ansible_ssh_private_key_file=~/.ssh/gcp_spot_iowa

[gcp:vars]
ansible_python_interpreter=/usr/bin/python3
# Cada VM nueva trae una huella SSH distinta: aceptarla la primera vez.
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
# Carpeta del proyecto en la VM remota (en la local es la del playbook).
infra_dir=/home/roberto/infra

[docker:children]
vm
gcp
