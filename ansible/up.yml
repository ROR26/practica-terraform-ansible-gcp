# Levanta los servicios de docker-compose.yml (mongodb, postgres, rustfs, mailpit).
# Uso:  ansible-playbook up.yml
- name: Levantar la infraestructura con Docker Compose
  hosts: docker
  gather_facts: false

  vars:
    # En la VM local, la carpeta del playbook; en las remotas, infra_dir del inventario.
    project_dir: "{{ infra_dir | default(playbook_dir) }}"
    project_name: infra
    required_vars:
      - MONGO_ROOT_USER
      - MONGO_ROOT_PASSWORD
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - MAILPIT_UI_USER
      - MAILPIT_UI_PASSWORD
      - RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY
    port_vars:
      - MONGO_PORT
      - POSTGRES_PORT
      - MAILPIT_SMTP_PORT
      - MAILPIT_UI_PORT
      - RUSTFS_API_PORT
      - RUSTFS_CONSOLE_PORT

  tasks:
    - name: Leer el .env
      ansible.builtin.slurp:
        src: "{{ project_dir }}/.env"
      register: env_raw

    - name: Convertir el .env en variables
      ansible.builtin.set_fact:
        env: >-
          {{ dict((env_raw.content | b64decode).splitlines()
                  | map('regex_findall', '^([A-Z0-9_]+)=(.*)$')
                  | select | map('first') | list) }}
      no_log: true

    - name: Comprobar que el .env tiene todos los valores y ninguno es 'cambiar'
      ansible.builtin.assert:
        that:
          - (env[item] | default('')) | length > 0
          - env[item] != 'cambiar'
        fail_msg: "Falta {{ item }} en .env o sigue con el valor de ejemplo"
        quiet: true
      loop: "{{ required_vars + port_vars }}"

    - name: Comprobar que los puertos del .env no se repiten
      ansible.builtin.assert:
        that: (port_vars | map('extract', env) | unique | length) == (port_vars | length)
        fail_msg: "Hay puertos repetidos en el .env"
        quiet: true

    - name: Ver qué puertos TCP están escuchando
      ansible.builtin.command: ss -ltnH
      register: ss_out
      changed_when: false
      check_mode: false

    - name: Ver qué puertos usa ya este mismo proyecto
      ansible.builtin.command: docker compose -p {{ project_name }} ps --format json
      register: own_ports_out
      changed_when: false
      check_mode: false

    - name: Calcular colisiones con otros procesos o contenedores
      ansible.builtin.set_fact:
        port_conflicts: >-
          {{ port_vars | map('extract', env)
             | intersect(ss_out.stdout | regex_findall(':(\d+)\s') | unique)
             | difference(own_ports_out.stdout_lines | map('from_json')
                          | map(attribute='Publishers') | flatten
                          | map(attribute='PublishedPort') | map('string') | unique) }}

    - name: Parar si algún puerto está ocupado por otra cosa
      ansible.builtin.assert:
        that: port_conflicts | length == 0
        fail_msg: "Puertos ocupados por otro proceso: {{ port_conflicts | join(', ') }}. Cámbialos en .env"
        quiet: true

    - name: Levantar los servicios
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        project_name: "{{ project_name }}"
        state: present
        pull: missing
        wait: true
        wait_timeout: 180
      register: compose

    - name: Estado de los servicios
      ansible.builtin.debug:
        msg: "{{ compose.containers | map(attribute='Name') | zip(compose.containers | map(attribute='State')) | map('join', ': ') | list }}"
